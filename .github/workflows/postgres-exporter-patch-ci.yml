name: Postgres Exporter Patch CI

on:
  pull_request:
    paths:
      - "ebpf/patches/postgres-exporter/**"
      - "ebpf/Dockerfile"
      - ".github/workflows/postgres-exporter-patch-ci.yml"
  push:
    branches:
      - main
    paths:
      - "ebpf/patches/postgres-exporter/**"
      - "ebpf/Dockerfile"
      - ".github/workflows/postgres-exporter-patch-ci.yml"

permissions:
  contents: read

jobs:
  test-postgres-exporter-patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Clone postgres_exporter and apply patches
        run: |
          POSTGRES_EXPORTER_VERSION=$(grep 'POSTGRES_EXPORTER_VERSION=' ebpf/Dockerfile | head -1 | sed 's/.*=//')
          git clone --depth 1 --branch ${POSTGRES_EXPORTER_VERSION} \
            https://github.com/prometheus-community/postgres_exporter.git /tmp/postgres-exporter
          cd /tmp/postgres-exporter
          git apply ${{ github.workspace }}/ebpf/patches/postgres-exporter/*.patch

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache: false

      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: postgres-exporter-go-${{ hashFiles('ebpf/Dockerfile', 'ebpf/patches/postgres-exporter/**') }}
          restore-keys: postgres-exporter-go-

      - name: go mod download
        working-directory: /tmp/postgres-exporter
        run: go mod download

      - name: gofmt -l .
        working-directory: /tmp/postgres-exporter
        run: files=$(gofmt -l .); if [[ -n "$files" ]]; then echo "$files"; exit 1; fi

      - name: go vet
        working-directory: /tmp/postgres-exporter
        run: go vet ./...

      - name: go test
        working-directory: /tmp/postgres-exporter
        run: go test ./...
